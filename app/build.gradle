plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arkal.powerbill'
    compileSdk 34

    defaultConfig {
        applicationId "com.arkal.powerbill"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No external libraries needed: the app uses the Android framework
    // (SQLiteOpenHelper, ListView, SeekBar, Spinner) only.
}
